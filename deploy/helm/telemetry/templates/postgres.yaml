{{- if .Values.postgresql.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "telemetry.name" . }}-db
type: Opaque
stringData:
  password: {{ .Values.postgresql.password | quote }}
  url: {{ printf "postgres://%s:%s@%s-postgres:5432/%s?sslmode=disable" (.Values.postgresql.username | urlquery) (.Values.postgresql.password | urlquery) (include "telemetry.name" .) (.Values.postgresql.database | urlquery) | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "telemetry.name" . }}-postgres
spec:
  selector: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: postgres}
  ports: [{name: postgres, port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "telemetry.name" . }}-postgres
spec:
  serviceName: {{ include "telemetry.name" . }}-postgres
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: postgres}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: postgres}
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: {{ .Values.postgresql.image }}
          args: ["postgres", "-c", "max_connections=200"]
          ports: [{containerPort: 5432, name: postgres}]
          env:
            - {name: POSTGRES_USER, value: {{ .Values.postgresql.username | quote }}}
            - {name: POSTGRES_DB, value: {{ .Values.postgresql.database | quote }}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: {{ include "telemetry.name" . }}-db, key: password}}
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", {{ .Values.postgresql.username | quote }}, "-d", {{ .Values.postgresql.database | quote }}]}
            initialDelaySeconds: 5
            periodSeconds: 3
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
  volumeClaimTemplates:
    - metadata: {name: data}
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.postgresql.storageClass }}
        storageClassName: {{ .Values.postgresql.storageClass | quote }}
        {{- end }}
        resources:
          requests: {storage: {{ .Values.postgresql.storage }}}
{{- end }}
