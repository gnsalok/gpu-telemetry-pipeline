name: CI
on: [pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: telemetry
          POSTGRES_PASSWORD: telemetry
          POSTGRES_DB: telemetry_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U telemetry -d telemetry_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://telemetry:telemetry@localhost:5432/telemetry_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: {go-version-file: go.mod, cache: true}
      - uses: azure/setup-helm@v4.3.0
        with: {version: v3.16.1}
      - run: make check coverage integration build
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.out
            coverage.html
            coverage-integration.out
      - run: docker build -t gpu-telemetry:ci .
